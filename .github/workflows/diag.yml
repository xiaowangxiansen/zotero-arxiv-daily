name: Diag
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Zotero probe
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
        run: |
          echo "ZOTERO_ID 长度: ${#ZOTERO_ID}"
          echo "ZOTERO_KEY 长度: ${#ZOTERO_KEY}"
          probe() {
            echo "== $1"
            curl -s -D /tmp/h -o /tmp/b -w "http=%{http_code}\n" \
              -H "Zotero-API-Version: 3" -H "Authorization: Bearer $ZOTERO_KEY" "$1" || true
            grep -i "^total-results" /tmp/h || true
            head -c 400 /tmp/b; echo; echo
          }
          probe "https://api.zotero.org/keys/current"
          probe "https://api.zotero.org/users/$ZOTERO_ID/items/top?limit=3"
          probe "https://api.zotero.org/users/$ZOTERO_ID/items?limit=3"
          probe "https://api.zotero.org/users/$ZOTERO_ID/collections?limit=3"
