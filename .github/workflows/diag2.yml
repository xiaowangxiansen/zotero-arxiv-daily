name: Diag2
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Zotero key permissions
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
        run: |
          curl -s -H "Zotero-API-Version: 3" -H "Authorization: Bearer $ZOTERO_KEY" \
            https://api.zotero.org/keys/current > /tmp/key.json
          echo "userID / username:"
          jq -r '"\(.userID) / \(.username)"' /tmp/key.json
          echo "access:"
          jq '.access' /tmp/key.json
