zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  include_path: null # Or set a list of glob patterns, e.g. ["2026/survey/**","2026/reading-group/**"]
  # 把当天论文写回 Zotero：父分类 arXiv Daily，子分类按日期（2026-10-22）
  push:
    enabled: true
    parent_collection: arXiv Daily
    collection_name: "{date}"

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.qq.com
  smtp_port: 465
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  # 用硅基流动的免费模型给每篇论文生成「一句话 TLDR」和「摘要中文翻译」。
  # 两个 secret：OPENAI_API_KEY（sk-...）、OPENAI_API_BASE（https://api.siliconflow.cn/v1）
  enabled: true
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE}
  api_mode: chat_completion
  generation_kwargs:
    # Qwen/Qwen2.5-7B-Instruct 是硅基流动的免费档模型
    model: Qwen/Qwen2.5-7B-Instruct
  # TLDR 的输出语言：改成中文，手机上直接读
  language: Chinese
  # 摘要翻译成中文（设为 false 可单独关掉翻译，只保留 TLDR）
  translate_abstract: true
  # 摘要翻译的目标语言
  target_lang: Chinese

source:
  arxiv:
    category: ["cs.AI","cs.CV","cs.LG","cs.CL"]

executor:
  debug: ${oc.env:DEBUG,null}
  source: ['arxiv']
  # 每天最终只保留 30 篇：邮件正文、papers/ 归档、Zotero 推送共用这一份列表。
  # 抓取量远大于此（4 个方向一天 400+ 篇），超出的直接丢掉，不进归档也不进 Zotero。
  max_paper_num: 30
  # 库为空时仍按抓取顺序照发（不跑个性化排序）。当前库已有论文，留着只是兜底。
  allow_empty_corpus: true
